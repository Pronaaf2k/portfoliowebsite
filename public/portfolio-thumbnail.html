<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samiyeel Alim Binaaf — Portfolio Thumbnail</title>
    <style>
      :root {
        --ink: #090b0d;
        --paper: #f0eee8;
        --muted: #9aa4a9;
        --line: #273137;
        --coral: #e95f4f;
        --cyan: #63d8e8;
        --yellow: #f4c95d;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #050607;
      }

      body {
        display: grid;
        place-items: center;
        font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
      }

      .thumbnail {
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-columns: 55% 45%;
        width: min(100vw, 1200px);
        aspect-ratio: 1200 / 630;
        overflow: hidden;
        color: var(--paper);
        background: var(--ink);
        border-top: 9px solid var(--coral);
      }

      .thumbnail::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(circle at 80% 57%, rgba(99, 216, 232, .08), transparent 34%);
        pointer-events: none;
      }

      .identity {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
        padding: 36px 30px 31px 45px;
        border-right: 1px solid var(--line);
      }

      .eyebrow, .meta, .handle, .signal-labels {
        font-family: Consolas, "Courier New", monospace;
        text-transform: uppercase;
        letter-spacing: .13em;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 13px;
        color: var(--cyan);
        font-size: 12px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 0 5px rgba(99, 216, 232, .1);
      }

      h1 {
        max-width: 610px;
        margin: 0;
        font-size: clamp(56px, 7.7vw, 94px);
        font-weight: 900;
        line-height: .78;
        letter-spacing: -.066em;
        text-transform: uppercase;
      }

      h1 span { display: block; }

      .bottom {
        display: grid;
        gap: 21px;
      }

      .role {
        width: fit-content;
        padding: 10px 14px 9px;
        color: var(--ink);
        background: var(--paper);
        font-size: 19px;
        font-weight: 800;
        letter-spacing: .02em;
        text-transform: uppercase;
      }

      .identity-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-top: 15px;
        border-top: 1px solid var(--line);
      }

      .handle {
        color: var(--coral);
        font-size: 15px;
        font-weight: 700;
      }

      .meta {
        color: var(--muted);
        font-size: 10px;
        text-align: right;
      }

      .signal {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
        padding: 36px 40px 31px;
      }

      .signal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font: 11px/1 Consolas, "Courier New", monospace;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .signal-head strong { color: var(--yellow); }
      .signal-head span { color: var(--muted); }

      .scope {
        position: relative;
        height: 66%;
        margin-inline: -8px;
      }

      .scope::before, .scope::after {
        content: "";
        position: absolute;
        border: 1px solid rgba(99, 216, 232, .14);
        border-radius: 50%;
      }

      .scope::before { width: 230px; height: 230px; right: -23px; top: 12%; }
      .scope::after { width: 112px; height: 112px; right: 36px; top: 31%; }

      svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .signal-labels {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 9px 24px;
        padding-top: 15px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 10px;
      }

      .signal-labels span::before {
        content: "/";
        margin-right: 8px;
        color: var(--cyan);
      }

      .signal-labels span:nth-child(2)::before { color: var(--yellow); }
      .signal-labels span:nth-child(3)::before { color: var(--coral); }

      /* Minimal thumbnail composition: derived from the portfolio hero, not the reference grid. */
      .thumbnail { grid-template-columns: 1fr; border-top-width: 6px; }
      .identity {
        align-items: center;
        justify-content: center;
        padding: 58px;
        border-right: 0;
        text-align: center;
      }
      .eyebrow { margin-bottom: 20px; }
      h1 {
        max-width: none;
        margin-bottom: 24px;
        font-size: clamp(48px, 6.9vw, 84px);
        line-height: .92;
        letter-spacing: -.06em;
      }
      h1 span { display: inline; }
      h1 span + span::before { content: " "; }
      h1 span:last-child { color: var(--coral); }
      .bottom { justify-items: center; gap: 27px; }
      .role {
        padding: 0;
        color: var(--muted);
        background: transparent;
        font: 400 19px/1.5 Consolas, "Courier New", monospace;
        letter-spacing: .01em;
        text-transform: none;
      }
      .identity-meta { justify-content: center; padding: 0; border: 0; }
      .handle {
        padding: 10px 18px;
        color: var(--paper);
        background: #121619;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 11px;
      }
      .meta, .signal { display: none; }
      .connections {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 9px;
      }
      .connections a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 13px 8px 9px;
        color: #aeb8bd;
        background: #121619;
        border: 1px solid #20292e;
        border-radius: 999px;
        font: 700 9px/1 Consolas, "Courier New", monospace;
        letter-spacing: .02em;
        text-decoration: none;
      }
      .connections a:hover,
      .connections a:focus-visible { color: var(--paper); border-color: var(--cyan); outline: none; }
      .connection-icon {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        color: var(--ink);
        background: var(--paper);
        border-radius: 50%;
        font: 900 8px/1 Arial, sans-serif;
      }
      .connection-icon svg { position: static; width: 11px; height: 11px; fill: currentColor; }

      @media (max-width: 720px) {
        .thumbnail { grid-template-columns: 58% 42%; }
        .identity { padding: 22px 18px 20px 25px; }
        .signal { padding: 22px 22px 20px; }
        .role { font-size: 11px; padding: 7px 9px; }
        .eyebrow, .handle { font-size: 8px; }
        .meta, .signal-head, .signal-labels { font-size: 6px; }
        .bottom { gap: 12px; }
        .identity-meta { padding-top: 9px; }
      }
    </style>
  </head>
